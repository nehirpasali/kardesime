<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Yönetici</title>
<script>
(function(){try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}})();
function toggleTheme(){var r=document.documentElement;var c=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");var n=c==="dark"?"light":"dark";r.setAttribute("data-theme",n);try{localStorage.setItem("theme",n)}catch(e){}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Giriş -->
<div class="login" id="loginBox" hidden>
  <h1>Yönetici girişi</h1>
  <div class="field"><label for="em">E-posta</label><input type="email" id="em" autocomplete="username"></div>
  <div class="field"><label for="pw">Şifre</label><input type="password" id="pw" autocomplete="current-password"></div>
  <button class="btn" id="loginBtn" style="width:100%">Giriş yap</button>
  <p class="msg" id="loginMsg"></p>
</div>

<!-- Panel -->
<div class="wrap" id="panel" hidden>
  <header class="top">
    <div>
      <h1>Yönetici paneli</h1>
      <p class="sub" id="count"></p>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="schedBtn" aria-label="Ders programı" title="Ders programı">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
      </button>
      <button class="icon-btn theme-btn" onclick="toggleTheme()" aria-label="Aydınlık veya karanlık mod" title="Tema">
        <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" id="logout" aria-label="Çıkış yap" title="Çıkış yap">
        <svg viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>
      </button>
    </div>
  </header>
  <div class="filters" id="filters"></div>
  <main id="list" style="margin-top:14px"></main>
</div>

<button class="fab" id="fab" aria-label="Yeni içerik ekle" hidden>
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- Yeni içerik penceresi -->
<div class="modal-back" id="mb">
  <div class="modal" role="dialog" aria-labelledby="mt">
    <h2 id="mt">Yeni içerik</h2>
    <div class="field">
      <label>Dosya (JPG, PNG veya PDF)</label>
      <label class="drop" id="dropLabel">
        <span id="dropText">Dosya seçmek için dokun</span>
        <input type="file" id="file" accept=".jpg,.jpeg,.png,application/pdf,image/jpeg,image/png">
      </label>
    </div>
    <div class="field"><label for="course">Ders</label><select id="course"></select></div>
    <div class="field"><label for="kind">İçerik türü</label><select id="kind"></select></div>
    <div class="field"><label for="due" id="dueLbl">Bitiş tarihi</label><input type="date" id="due"></div>
    <div class="field"><label for="ttl">Başlık</label><input type="text" id="ttl" maxlength="120" placeholder="Örn. 3. ünite test soruları"></div>
    <div class="field" id="gcField" hidden>
      <label class="checkrow"><input type="checkbox" id="gc" checked> Google Takvim'e ekle, Beril'e davet gitsin</label>
    </div>
    <div class="bar" id="bar"><i></i></div>
    <p class="msg" id="msg"></p>
    <div class="row">
      <button class="btn ghost" id="cancel">Vazgeç</button>
      <button class="btn" id="save">Kaydet</button>
    </div>
  </div>
</div>

<!-- Ders programı penceresi -->
<div class="modal-back" id="sb">
  <div class="modal" role="dialog" aria-labelledby="st">
    <h2 id="st">Ders programı</h2>
    <div class="filters" id="dayTabs" style="padding-top:0"></div>
    <div id="slots" style="margin-top:14px"></div>
    <datalist id="lessonList"></datalist>
    <p class="msg" id="smsg"></p>
    <div class="row">
      <button class="btn ghost" id="sCancel">Kapat</button>
      <button class="btn" id="sSave">Kaydet</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig, COURSES, GOOGLE_CLIENT_ID, BERIL_EMAIL, CLOUDINARY_CLOUD_NAME, CLOUDINARY_UPLOAD_PRESET, daysLeft, esc, dueLabel, dateText } from "./firebase-config.js";
import { KINDS, SCHEDULE_SLOTS, EXTRA_LESSONS, DAY_NAMES, hasDue, kindOf } from "./extras.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);

// ---- Google Takvim (isteğe bağlı: config'te CLIENT_ID ve e-posta doluysa çalışır)
const GCAL = !!(GOOGLE_CLIENT_ID && BERIL_EMAIL);
let gTok = null, gExp = 0;
const loadGsi = () => new Promise((res, rej) => {
  if (window.google?.accounts?.oauth2) return res();
  const sc = document.createElement("script");
  sc.src = "https://accounts.google.com/gsi/client"; sc.onload = res; sc.onerror = rej;
  document.head.appendChild(sc);
});
async function getToken() {
  if (gTok && Date.now() < gExp) return gTok;
  await loadGsi();
  return new Promise((res, rej) => {
    google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: "https://www.googleapis.com/auth/calendar.events",
      callback: r => { if (r.error) return rej(r); gTok = r.access_token; gExp = Date.now() + (r.expires_in - 60) * 1000; res(gTok); },
      error_callback: rej
    }).requestAccessToken();
  });
}
const nextDay = str => {
  const [y, m, d] = str.split("-").map(Number);
  const x = new Date(y, m - 1, d + 1);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
};
async function createEvent(tok, { title, course, kind, due, fileUrl }) {
  const r = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events?sendUpdates=all", {
    method: "POST",
    headers: { Authorization: `Bearer ${tok}`, "Content-Type": "application/json" },
    body: JSON.stringify({
      summary: kind === "Ödev" ? `${course}: ${title}` : `${course} (${kind}): ${title}`,
      description: `Dosya: ${fileUrl}`,
      start: { date: due }, end: { date: nextDay(due) },
      attendees: [{ email: BERIL_EMAIL }],
      reminders: { useDefault: false, overrides: [
        { method: "popup", minutes: 3780 },
        { method: "popup", minutes: 900 },
        { method: "email", minutes: 900 }
      ] }
    })
  });
  if (!r.ok) throw new Error(await r.text());
  return (await r.json()).id;
}

let tasks = [], filter = "all", unsub = null;

// ---- Giriş / çıkış
onAuthStateChanged(auth, user => {
  $("loginBox").hidden = !!user;
  $("panel").hidden = !user;
  $("fab").hidden = !user;
  if (user) {
    unsub = onSnapshot(collection(db, "tasks"), s => {
      tasks = s.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    });
  } else if (unsub) { unsub(); unsub = null; }
});
const login = async () => {
  $("loginMsg").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); }
  catch { $("loginMsg").textContent = "E-posta veya şifre hatalı."; }
};
$("loginBtn").onclick = login;
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
$("logout").onclick = () => signOut(auth);

// ---- Liste
function render() {
  $("count").textContent = `${tasks.length} içerik`;
  $("filters").innerHTML = ["all", ...COURSES].map(c =>
    `<button class="${filter === c ? "active" : ""}" data-f="${esc(c)}">${c === "all" ? "Tümü" : esc(c)}</button>`).join("");
  const shown = tasks.filter(t => filter === "all" || t.course === filter)
    .sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
  $("list").innerHTML = shown.length ? shown.map(t => {
    const dated = hasDue(t);
    const n = dated ? daysLeft(t.due) : null;
    return `<article class="card ${dated && n < 0 ? "done" : ""}">
      <div class="body">
        <div class="t">${esc(t.title)}</div>
        <div class="meta">
          <span class="chip">${esc(t.course)}</span>
          <span class="chip kind">${esc(kindOf(t))}</span>
          <span class="chip ${dated && n >= 0 && n <= 2 ? "soon" : "file"}">${dated ? `${dueLabel(n)}, ${dateText(t.due)}` : "Tarihsiz"}</span>
          ${t.fileUrl ? `<a class="chip file" href="${esc(t.fileUrl)}" target="_blank" rel="noopener">Dosya</a>` : ""}
          ${t.gcalId ? '<span class="chip">Takvimde</span>' : ""}
          <button class="del" data-del="${t.id}">Sil</button>
        </div>
      </div>
    </article>`;
  }).join("") : `<div class="empty"><b>Henüz içerik yok</b>Sağ alttaki + ile ilk içeriği ekle.</div>`;
}
$("filters").addEventListener("click", e => {
  const b = e.target.closest("[data-f]"); if (b) { filter = b.dataset.f; render(); }
});
$("list").addEventListener("click", async e => {
  const b = e.target.closest("[data-del]"); if (!b) return;
  const t = tasks.find(x => x.id === b.dataset.del);
  if (!t || !confirm(`"${t.title}" silinsin mi?`)) return;
  if (t.gcalId && GCAL) {
    try {
      const tk = await getToken();
      await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${t.gcalId}?sendUpdates=all`, { method: "DELETE", headers: { Authorization: `Bearer ${tk}` } });
    } catch (err) { console.warn(err); }
  }
  await deleteDoc(doc(db, "tasks", t.id));
});

// ---- Yeni içerik penceresi
$("course").innerHTML = COURSES.map(c => `<option>${esc(c)}</option>`).join("");
$("kind").innerHTML = KINDS.map(k => `<option>${esc(k)}</option>`).join("");
$("gcField").hidden = !GCAL;
const updDueLbl = () => { $("dueLbl").textContent = $("kind").value === "Ödev" ? "Bitiş tarihi" : "Bitiş tarihi (isteğe bağlı)"; };
$("kind").onchange = updDueLbl;
const open = () => { $("mb").classList.add("open"); if (GCAL) loadGsi().catch(() => {}); };
const close = () => {
  $("mb").classList.remove("open");
  $("file").value = ""; $("ttl").value = ""; $("due").value = ""; $("kind").selectedIndex = 0; updDueLbl();
  $("dropText").textContent = "Dosya seçmek için dokun";
  $("msg").textContent = ""; $("bar").style.display = "none"; $("bar").firstElementChild.style.width = "0";
  $("save").disabled = false;
};
$("fab").onclick = open;
$("cancel").onclick = close;
$("mb").addEventListener("click", e => { if (e.target === $("mb")) close(); });
$("file").onchange = () => {
  const f = $("file").files[0];
  $("dropText").textContent = f ? f.name : "Dosya seçmek için dokun";
  if (f && !$("ttl").value) $("ttl").value = f.name.replace(/\.[^.]+$/, "");
};

$("save").onclick = async () => {
  const f = $("file").files[0], title = $("ttl").value.trim(), due = $("due").value, course = $("course").value, kind = $("kind").value;
  const msg = $("msg"); msg.textContent = "";
  if (!f) return msg.textContent = "Bir dosya seç.";
  if (!/^(image\/(jpeg|png)|application\/pdf)$/.test(f.type)) return msg.textContent = "Sadece JPG, PNG veya PDF yükleyebilirsin.";
  if (f.size > 10 * 1024 * 1024) return msg.textContent = "Dosya 10 MB'tan küçük olmalı.";
  if (!title) return msg.textContent = "Bir başlık yaz.";
  if (kind === "Ödev" && !due) return msg.textContent = "Ödev için bitiş tarihini seç.";

  let tok = null;
  if (GCAL && $("gc").checked && due) {
    try { tok = await getToken(); }
    catch (err) { console.warn(err); return msg.textContent = "Google Takvim izni alınamadı. İzinsiz devam etmek için kutunun işaretini kaldır."; }
  }
  $("save").disabled = true;
  $("bar").style.display = "block";
  const ext = f.type === "application/pdf" ? "pdf" : f.type === "image/png" ? "png" : "jpg";
  const fail = text => { msg.textContent = text; $("bar").style.display = "none"; $("save").disabled = false; };
  if (!CLOUDINARY_CLOUD_NAME || !CLOUDINARY_UPLOAD_PRESET) return fail("firebase-config.js içindeki Cloudinary ayarları boş.");

  const fd = new FormData();
  fd.append("file", f);
  fd.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
  const xhr = new XMLHttpRequest();
  xhr.open("POST", `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`);
  xhr.timeout = 120000;
  xhr.upload.onprogress = e => { if (e.lengthComputable) $("bar").firstElementChild.style.width = (e.loaded / e.total * 100) + "%"; };
  xhr.onerror = () => fail("Dosya yüklenemedi. İnternet bağlantını ve Cloudinary ayarlarını kontrol et.");
  xhr.ontimeout = () => fail("Yükleme çok uzun sürdü, tekrar dene.");
  xhr.onload = async () => {
    let res = {};
    try { res = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status < 200 || xhr.status >= 300 || !res.secure_url) {
      return fail("Cloudinary hatası: " + (res.error?.message || xhr.status));
    }
    try {
      const fileUrl = res.secure_url;
      let gcalId = null;
      if (tok) {
        try { gcalId = await createEvent(tok, { title, course, kind, due, fileUrl }); }
        catch (err) { console.warn(err); alert("İçerik kaydedildi ama Google Takvim'e eklenemedi."); }
      }
      await addDoc(collection(db, "tasks"), {
        title, course, kind, due: due || "", fileUrl, fileType: ext === "pdf" ? "pdf" : "image",
        fileName: f.name, gcalId, createdAt: serverTimestamp()
      });
      close();
    } catch (err) { console.error(err); fail("Kaydedilemedi. Firestore kurallarını kontrol et."); }
  };
  xhr.send(fd);
};

// ---- Ders programı editörü
$("lessonList").innerHTML = [...COURSES, ...EXTRA_LESSONS].map(c => `<option value="${esc(c)}">`).join("");
let sched = {}, sDay = 1;
const D = [1, 2, 3, 4, 5];
const padDay = a => { const x = Array.from(a || []).map(v => String(v || "")); while (x.length < SCHEDULE_SLOTS) x.push(""); return x.slice(0, SCHEDULE_SLOTS); };

function renderSched() {
  $("dayTabs").innerHTML = D.map((d, i) => `<button class="${d === sDay ? "active" : ""}" data-d="${d}">${DAY_NAMES[i]}</button>`).join("");
  $("slots").innerHTML = sched[sDay].map((v, i) =>
    `<div class="slot-row"><b>${i + 1}</b><input type="text" list="lessonList" data-i="${i}" value="${esc(v)}" placeholder="Boş"></div>`).join("");
}
$("dayTabs").addEventListener("click", e => { const b = e.target.closest("[data-d]"); if (b) { sDay = +b.dataset.d; renderSched(); } });
$("slots").addEventListener("input", e => { const i = e.target.dataset.i; if (i !== undefined) sched[sDay][+i] = e.target.value; });

$("schedBtn").onclick = async () => {
  $("smsg").textContent = ""; $("smsg").className = "msg";
  D.forEach(d => sched[d] = padDay());
  $("sb").classList.add("open"); renderSched();
  try {
    const s = await getDoc(doc(db, "settings", "schedule"));
    if (s.exists()) { const days = s.data().days || {}; D.forEach(d => sched[d] = padDay(days[d])); renderSched(); }
  } catch (err) { console.error(err); $("smsg").textContent = "Mevcut program okunamadı. Firestore kurallarında settings izni var mı?"; }
};
$("sCancel").onclick = () => $("sb").classList.remove("open");
$("sb").addEventListener("click", e => { if (e.target === $("sb")) $("sb").classList.remove("open"); });
$("sSave").onclick = async () => {
  const days = {};
  D.forEach(d => days[d] = sched[d].map(v => v.trim()));
  $("sSave").disabled = true; $("smsg").textContent = ""; $("smsg").className = "msg";
  try {
    await setDoc(doc(db, "settings", "schedule"), { days, updatedAt: serverTimestamp() });
    $("smsg").className = "msg ok"; $("smsg").textContent = "Kaydedildi.";
    setTimeout(() => $("sb").classList.remove("open"), 700);
  } catch (err) {
    console.error(err);
    $("smsg").textContent = "Kaydedilemedi (" + (err.code || err.message) + "). Firestore kurallarına settings ekledin mi?";
  }
  $("sSave").disabled = false;
};
</script>
</body>
</html>
