<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beril'in Görevleri</title>
<script>
(function(){try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}})();
function toggleTheme(){var r=document.documentElement;var c=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");var n=c==="dark"?"light":"dark";r.setAttribute("data-theme",n);try{localStorage.setItem("theme",n)}catch(e){}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="fixed-ctl">
  <button class="icon-btn theme-btn" onclick="toggleTheme()" aria-label="Aydınlık veya karanlık mod">
    <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <button class="icon-btn" id="menuBtn" aria-label="Dersleri aç">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
</div>

<header class="hero">
  <div class="hero-inner">
    <h1 class="hello"><span id="hGreet"></span><span id="hName"></span></h1>
    <p class="hero-sub" id="heroSub"></p>
    <div class="quote">
      <svg viewBox="0 0 24 24"><path d="M12 2l2.2 7.3L22 12l-7.8 2.7L12 22l-2.2-7.3L2 12l7.8-2.7z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2l2.2 7.3L22 12l-7.8 2.7L12 22l-2.2-7.3L2 12l7.8-2.7z"/></svg>
      <p id="quoteText"></p>
    </div>
    <a class="hero-go" href="#content">Görevlerime bak
      <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </a>
  </div>
</header>

<div class="wrap wide" id="content">
  <div class="sec-head">
    <h2 id="secTitle">Yaklaşan görevler</h2>
    <p class="sub" id="secSub"></p>
  </div>
  <div class="filters" id="kindFilters" hidden></div>

  <div class="layout">
    <aside class="side">
      <section class="cal" aria-label="Takvim">
        <div class="cal-head">
          <button class="cal-nav" id="prev" aria-label="Önceki ay">‹</button>
          <b id="calTitle"></b>
          <button class="cal-nav" id="next" aria-label="Sonraki ay">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </section>
    </aside>
    <main id="list" class="rail"></main>
  </div>

  <section class="rt" id="routine">
    <div class="sec-head"><h2>Günlük program</h2></div>
    <div class="filters" id="rtTabs"></div>
    <div id="rtList"></div>
  </section>

  <section class="sched" id="schedule">
    <div class="sec-head"><h2>Ders programı</h2></div>
    <div id="sched"></div>
  </section>

  <section class="rt" id="pool">
    <div class="sec-head"><h2>Soru havuzu</h2><p class="sub">Bir ders seç, kendini dene</p></div>
    <div id="poolBox"></div>
  </section>

  <section class="rt" id="karne">
    <div class="sec-head"><h2>Karnem</h2><p class="sub">Çözdüğün testlerin sonuçları</p></div>
    <div class="avg" id="kAvg"></div>
    <div class="kg" id="kList"></div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Dersler">
  <h3>Dersler</h3>
  <div id="nav"></div>
</aside>
<div class="lightbox" id="lb"><img alt=""></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig, COURSES, COURSE_COLORS, STUDENT_NAME, daysLeft, esc, dueLabel, dateText, parseDay } from "./firebase-config.js";
import { QUOTES } from "./quotes.js";
import { KINDS, DAY_NAMES, DAY_SHORT, ALL_DAYS, netOf, hasDue, kindOf } from "./extras.js";

const db = getFirestore(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
const colorOf = c => COURSE_COLORS[c] || "#8C86A6";
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const ts = t => t.createdAt?.toMillis?.() ?? 0;
const D = [1, 2, 3, 4, 5];

const now = new Date();
const hour = now.getHours();
const greet = hour < 5 ? "İyi geceler" : hour < 12 ? "Günaydın" : hour < 18 ? "İyi günler" : hour < 22 ? "İyi akşamlar" : "İyi geceler";
$("hGreet").textContent = greet;
$("hName").textContent = STUDENT_NAME;
const dayNum = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);
$("quoteText").textContent = QUOTES[dayNum % QUOTES.length];

let tasks = [], schedule = null, schedErr = false;
let loaded = false, loadErr = null;
let view = "all", kindFilter = "all", showPast = false, selDay = null;
let vy = now.getFullYear(), vm = now.getMonth();
const jd = now.getDay();
const todayD = jd >= 1 && jd <= 5 ? jd : 0;
let schedDay = todayD || 1;
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem("done") || "[]")); } catch {}

onSnapshot(collection(db, "tasks"), snap => {
  tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  loaded = true; loadErr = null; render();
}, err => { console.error(err); loadErr = err.code || err.message; render(); });

onSnapshot(doc(db, "settings", "schedule"), s => {
  schedule = s.exists() ? s.data() : null; schedErr = false; renderSchedule();
}, err => { console.error(err); schedErr = true; renderSchedule(); });

function render() { renderNav(); renderCal(); renderHero(); renderList(); }

function pendingDated() { return tasks.filter(t => hasDue(t) && daysLeft(t.due) >= 0 && !done.has(t.id)); }

function renderHero() {
  const open = pendingDated();
  const today = open.filter(t => daysLeft(t.due) === 0).length;
  $("heroSub").textContent = !loaded ? "" : open.length
    ? `${open.length} bekleyen görev${today ? `, ${today} tanesi bugün` : ""}`
    : "Bekleyen görev yok, keyfine bak";
}

function renderList() {
  const list = $("list");
  const inCourse = view !== "all";
  $("secTitle").textContent = inCourse ? view : "Yaklaşan görevler";

  // Tür filtreleri (sadece bir ders açıkken)
  const kf = $("kindFilters");
  kf.hidden = !inCourse;
  if (inCourse) {
    const ofCourse = tasks.filter(t => t.course === view);
    kf.innerHTML = [`<button class="${kindFilter === "all" ? "active" : ""}" data-kind="all">Tümü<small>${ofCourse.length}</small></button>`]
      .concat(KINDS.map(k => `<button class="${kindFilter === k ? "active" : ""}" data-kind="${esc(k)}">${esc(k)}<small>${ofCourse.filter(t => kindOf(t) === k).length}</small></button>`)).join("");
  }

  list.classList.toggle("rail", !selDay && !inCourse);

  if (loadErr) { list.innerHTML = `<div class="empty"><b>Görevler yüklenemedi</b>Bir sorun var (${esc(loadErr)}). Biraz sonra tekrar dene.</div>`; return; }
  if (!loaded) { list.innerHTML = `<div class="empty">Yükleniyor…</div>`; return; }

  const base = inCourse ? tasks.filter(t => t.course === view) : tasks;
  const mine = inCourse && kindFilter !== "all" ? base.filter(t => kindOf(t) === kindFilter) : base;
  $("secSub").textContent = inCourse ? `${mine.length} içerik` : "En yakın tarih en üstte";

  // Takvimden gün seçildiyse
  if (selDay) {
    const dayTasks = mine.filter(t => t.due === selDay);
    list.innerHTML = `<div class="day-pick"><span>${dateText(selDay)}</span><button id="clr">Tümünü göster</button></div>` +
      (dayTasks.length ? dayTasks.map(t => card(t, true)).join("") : `<div class="empty"><b>Bu gün boş</b>Bu tarihte görev yok.</div>`);
    return;
  }

  // Ders sayfası: tüm içerikler
  if (inCourse) {
    const up = mine.filter(t => hasDue(t) && daysLeft(t.due) >= 0).sort((a, b) => a.due.localeCompare(b.due));
    const nod = mine.filter(t => !hasDue(t)).sort((a, b) => ts(b) - ts(a));
    const past = mine.filter(t => hasDue(t) && daysLeft(t.due) < 0).sort((a, b) => b.due.localeCompare(a.due));
    const sec = (title, arr) => arr.length ? `<h3 class="group-h">${title}</h3>${arr.map(t => card(t, true)).join("")}` : "";
    const html = sec("Yaklaşanlar", up) + sec("Notlar ve kaynaklar", nod) + sec("Geçmiş", past);
    list.innerHTML = html || `<div class="empty"><b>Burada henüz bir şey yok</b>${kindFilter !== "all" ? `${esc(kindFilter)} yüklenmemiş.` : "Bu derse henüz içerik eklenmedi."}</div>`;
    return;
  }

  // Görev yöneticisi: tarihi olanlar, yakından uzağa
  const upcoming = mine.filter(t => hasDue(t) && daysLeft(t.due) >= 0);
  const past = mine.filter(t => hasDue(t) && daysLeft(t.due) < 0).sort((a, b) => b.due.localeCompare(a.due));
  let html = "";
  if (!upcoming.length) {
    html += `<div class="empty"><b>Her şey yolunda</b>Yaklaşan görev yok.</div>`;
  } else {
    const groups = {};
    upcoming.forEach(t => (groups[t.due] ||= []).push(t));
    for (const due of Object.keys(groups).sort()) {
      const n = daysLeft(due);
      const cls = n === 0 ? "today" : n <= 2 ? "soon" : "";
      html += `<section class="day ${cls}">
        <div class="day-head"><h2>${dueLabel(n)}</h2><span>${dateText(due)}</span></div>
        ${groups[due].map(t => card(t, false)).join("")}
      </section>`;
    }
  }
  if (past.length) {
    html += `<button class="past-toggle" id="pt">${showPast ? "Geçmiş görevleri gizle" : `Geçmiş görevler (${past.length})`}</button>`;
    if (showPast) html += `<section class="day past">${past.map(t => card(t, true)).join("")}</section>`;
  }
  list.innerHTML = html;
}

function gcalLink(t) {
  const nx = parseDay(t.due); nx.setDate(nx.getDate() + 1);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(`${t.course}: ${t.title}`) +
    "&dates=" + t.due.replaceAll("-", "") + "/" + iso(nx).replaceAll("-", "") +
    "&details=" + encodeURIComponent(t.fileUrl || "");
}

function card(t, showDate) {
  const dated = hasDue(t);
  const n = dated ? daysLeft(t.due) : null;
  const isDone = done.has(t.id);
  const inCourse = view !== "all";
  const soon = dated && n >= 0 && n <= 2 && !isDone;
  const fileChip = t.fileUrl
    ? `<button class="chip file" data-open="${esc(t.fileUrl)}" data-type="${esc(t.fileType)}">${t.fileType === "pdf" ? "PDF aç" : "Görseli aç"}</button>` : "";
  const calChip = (dated && !t.gcalId && n >= 0)
    ? `<a class="chip file" href="${esc(gcalLink(t))}" target="_blank" rel="noopener">Takvime ekle</a>` : "";
  const dueChip = dated
    ? (showDate ? `<span class="chip ${soon ? "soon" : "file"}">${dueLabel(n)}, ${dateText(t.due)}</span>`
                : soon ? `<span class="chip soon">${dueLabel(n)}</span>` : "")
    : "";
  return `<article class="card ${isDone ? "done" : ""}" style="--c:${colorOf(t.course)}">
    <button class="check" data-done="${t.id}" aria-label="Tamamlandı olarak işaretle" aria-pressed="${isDone}">
      <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </button>
    <div class="body">
      <div class="t">${esc(t.title)}</div>
      <div class="meta">
        ${inCourse ? "" : `<span class="chip course" style="--c:${colorOf(t.course)}">${esc(t.course)}</span>`}
        <span class="chip kind">${esc(kindOf(t))}</span>
        ${dueChip}${fileChip}${calChip}
      </div>
    </div>
  </article>`;
}

function renderNav() {
  const count = c => pendingDated().filter(t => t.course === c).length;
  const item = (attr, key, label, n, color) =>
    `<button class="nav-item ${attr === "data-view" && view === key ? "active" : ""}" ${attr}="${esc(key)}"><span>${color ? `<i class="dot" style="--c:${color}"></i>` : ""}${esc(label)}</span><small>${n || ""}</small></button>`;
  $("nav").innerHTML =
    item("data-view", "all", "Tüm görevler", pendingDated().length) +
    item("data-go", "routine", "Günlük program", 0) +
    item("data-go", "schedule", "Ders programı", 0) +
    item("data-go", "pool", "Soru havuzu", 0) +
    item("data-go", "karne", "Karnem", 0) +
    `<div class="nav-sep"></div>` +
    COURSES.map(c => item("data-view", c, c, count(c), colorOf(c))).join("");
}

function renderCal() {
  const byDay = {};
  tasks.filter(hasDue).forEach(t => (byDay[t.due] ||= []).push(t));
  const first = new Date(vy, vm, 1);
  const offset = (first.getDay() + 6) % 7;
  const dim = new Date(vy, vm + 1, 0).getDate();
  const todayIso = iso(new Date());
  let cells = ["Pt", "Sa", "Ça", "Pe", "Cu", "Ct", "Pz"].map(d => `<div class="cal-dow">${d}</div>`).join("");
  for (let i = 0; i < offset; i++) cells += "<div></div>";
  for (let d = 1; d <= dim; d++) {
    const key = `${vy}-${pad(vm + 1)}-${pad(d)}`;
    const l = byDay[key] || [];
    const colors = [...new Set(l.map(t => colorOf(t.course)))].slice(0, 3);
    cells += `<button class="cal-day ${key === todayIso ? "today" : ""} ${key === selDay ? "sel" : ""}" data-day="${key}" aria-label="${d}. gün${l.length ? `, ${l.length} görev` : ""}">
      <span>${d}</span><span class="dots">${colors.map(c => `<i style="--c:${c}"></i>`).join("")}</span></button>`;
  }
  $("calTitle").textContent = first.toLocaleDateString("tr-TR", { month: "long", year: "numeric" });
  $("calGrid").innerHTML = cells;
}

function renderSchedule() {
  const box = $("sched");
  if (schedErr) { box.innerHTML = `<div class="empty"><b>Ders programı yüklenemedi</b>Biraz sonra tekrar dene.</div>`; return; }
  const days = schedule?.days || {};
  const col = d => Array.from(days[d] || []).map(x => String(x || "").trim());
  const rows = Math.max(0, ...D.map(d => { const a = col(d); let i = a.length; while (i > 0 && !a[i - 1]) i--; return i; }));
  if (!rows) { box.innerHTML = `<div class="empty"><b>Ders programı henüz eklenmedi</b>Eklenince burada görünecek.</div>`; return; }

  const lessonBtn = (name, tc) => `<button class="lesson ${tc ? "tc" : ""}" data-lesson="${esc(name)}" style="--c:${colorOf(name)}">${esc(name)}</button>`;
  let g = `<div class="sg"><div></div>${D.map((d, i) => `<div class="h ${d === todayD ? "today" : ""}">${DAY_NAMES[i]}</div>`).join("")}`;
  for (let r = 0; r < rows; r++) {
    g += `<div class="n">${r + 1}</div>`;
    for (const d of D) { const name = col(d)[r]; g += name ? lessonBtn(name, d === todayD) : `<div class="lesson none"></div>`; }
  }
  g += `</div>`;

  let l = `<div class="sd"><div class="filters">${D.map((d, i) => `<button class="${d === schedDay ? "active" : ""}" data-sd="${d}">${DAY_SHORT[i]}</button>`).join("")}</div>`;
  const a = col(schedDay); let any = false;
  for (let r = 0; r < rows; r++) if (a[r]) { any = true; l += `<button class="sd-row" data-lesson="${esc(a[r])}" style="--c:${colorOf(a[r])}"><b>${r + 1}</b><span>${esc(a[r])}</span></button>`; }
  if (!any) l += `<div class="empty">Bu gün için ders yok.</div>`;
  l += `</div>`;
  box.innerHTML = g + l;
}

let routine = null, results = [], rtDay = jd === 0 ? 7 : jd;
onSnapshot(doc(db, "settings", "routine"), s => { routine = s.exists() ? s.data() : null; renderRoutine(); }, () => { routine = null; renderRoutine(); });
onSnapshot(collection(db, "results"), s => { results = s.docs.map(d => ({ id: d.id, ...d.data() })); renderKarne(); }, err => console.error(err));

function renderRoutine() {
  $("rtTabs").innerHTML = ALL_DAYS.map((n, i) => `<button class="${i + 1 === rtDay ? "active" : ""}" data-rd="${i + 1}">${n.slice(0, 3)}</button>`).join("");
  const items = Array.from(routine?.days?.[rtDay] || []).filter(x => x && x.title).sort((a, b) => a.time.localeCompare(b.time));
  const n = new Date(), nowT = `${pad(n.getHours())}:${pad(n.getMinutes())}`;
  let cur = -1;
  if (rtDay === (jd === 0 ? 7 : jd)) items.forEach((x, i) => { if (x.time <= nowT) cur = i; });
  $("rtList").innerHTML = items.length
    ? items.map((x, i) => `<div class="rt-row ${i === cur ? "now" : ""}"><b>${esc(x.time)}</b><span>${esc(x.title)}</span></div>`).join("")
    : `<div class="empty"><b>Bu gün için plan yok</b>Eklenince burada görünecek.</div>`;
}

function renderKarne() {
  const by = {};
  results.forEach(r => (by[r.course] ||= []).push(r));
  $("kAvg").innerHTML = Object.entries(by).map(([c, a]) =>
    `<span class="chip course" style="--c:${colorOf(c)}">${esc(c)}: ort. net ${(a.reduce((s, r) => s + r.net, 0) / a.length).toFixed(1)}</span>`).join("");
  const sorted = [...results].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  $("kList").innerHTML = sorted.length ? sorted.map(r => `<article class="kc" style="--c:${colorOf(r.course)}">
    <div class="t">${esc(r.title)}</div>
    <div class="meta"><span class="chip course" style="--c:${colorOf(r.course)}">${esc(r.course)}</span><span class="chip kind">${esc(r.kind || "Test")}</span>${r.date ? `<span class="chip kind">${dateText(r.date)}</span>` : ""}</div>
    <div class="nums"><span>Doğru <b>${r.correct}</b></span><span>Yanlış <b>${r.wrong}</b></span><span>Boş <b>${r.blank}</b></span><span class="net">Net ${r.net}</span></div>
  </article>`).join("") : `<div class="empty"><b>Henüz sonuç yok</b>Testler değerlendirilince burada görünecek.</div>`;
}
$("rtTabs").addEventListener("click", e => { const b = e.target.closest("[data-rd]"); if (b) { rtDay = +b.dataset.rd; renderRoutine(); } });

let poolQs = [], pCourse = null, quiz = null;
onSnapshot(collection(db, "questions"), s => { poolQs = s.docs.map(d => ({ id: d.id, ...d.data() })); renderPool(); }, err => console.error(err));

function renderPool() {
  const cnt = c => poolQs.filter(q => q.course === c).length;
  let h = `<div class="filters">${COURSES.map(c => `<button class="${c === pCourse ? "active" : ""}" data-pc="${esc(c)}">${esc(c)}<small>${cnt(c)}</small></button>`).join("")}</div>`;
  if (quiz && quiz.i >= quiz.qs.length) {
    h += `<article class="kc" style="--c:${colorOf(pCourse)};margin-top:16px"><div class="t">Test bitti</div>
      <div class="nums"><span>Doğru <b>${quiz.c}</b></span><span>Yanlış <b>${quiz.w}</b></span><span>Boş <b>${quiz.b}</b></span><span class="net">Net ${netOf(quiz.c, quiz.w)}</span></div>
      <div class="meta" style="margin-top:14px"><button class="chip file" data-start>Yeni test</button><button class="chip file" data-quit>Kapat</button></div></article>`;
  } else if (quiz) {
    const q = quiz.qs[quiz.i], shown = quiz.ans != null || quiz.skip;
    h += `<article class="kc" style="--c:${colorOf(pCourse)};margin-top:16px"><div class="sub">Soru ${quiz.i + 1} / ${quiz.qs.length}</div>
      <div class="t" style="margin:8px 0 6px">${esc(q.q)}</div>
      ${q.options.map((o, k) => `<button class="sd-row" ${shown ? "disabled" : `data-opt="${k}"`} style="--c:${shown ? (k === q.answer ? "#4FB286" : k === quiz.ans ? "#E2574C" : "#8C86A6") : "#8C86A6"}"><b>${"ABCD"[k]}</b><span>${esc(o)}</span></button>`).join("")}
      ${shown ? `<p class="sub" style="margin:12px 0">${esc(q.explain || "")}</p><button class="chip file" data-next>${quiz.i + 1 < quiz.qs.length ? "Sonraki soru" : "Sonucu gör"}</button>`
              : `<button class="past-toggle" data-skip style="margin-top:12px">Boş bırak</button>`}</article>`;
  } else if (pCourse) {
    h += cnt(pCourse) ? `<button class="btn" data-start style="margin-top:16px;max-width:280px">${Math.min(10, cnt(pCourse))} soruluk test başlat</button>`
      : `<div class="empty"><b>Bu derste henüz soru yok</b>Eklenince burada görünecek.</div>`;
  } else h += `<div class="empty"><b>Bir ders seç</b>O dersin sorularıyla test çözebilirsin.</div>`;
  $("poolBox").innerHTML = h;
}
$("poolBox").addEventListener("click", e => {
  const t = k => e.target.closest(`[data-${k}]`);
  if (t("pc")) { pCourse = t("pc").dataset.pc; quiz = null; }
  else if (t("start")) quiz = { qs: [...poolQs.filter(q => q.course === pCourse)].sort(() => Math.random() - .5).slice(0, 10), i: 0, c: 0, w: 0, b: 0, ans: null, skip: false };
  else if (t("opt")) { const k = +t("opt").dataset.opt; quiz.ans = k; k === quiz.qs[quiz.i].answer ? quiz.c++ : quiz.w++; }
  else if (t("skip")) { quiz.skip = true; quiz.b++; }
  else if (t("next")) { quiz.i++; quiz.ans = null; quiz.skip = false; }
  else if (t("quit")) quiz = null;
  else return;
  renderPool();
});

// Etkileşimler
const drawer = $("drawer"), scrim = $("scrim");
const toggleDrawer = o => { drawer.classList.toggle("open", o); scrim.classList.toggle("open", o); };
const goTo = id => $(id).scrollIntoView({ behavior: "smooth", block: "start" });
const openCourse = c => { view = c; kindFilter = "all"; selDay = null; showPast = false; render(); goTo("content"); };

$("menuBtn").onclick = () => toggleDrawer(true);
scrim.onclick = () => toggleDrawer(false);
document.addEventListener("keydown", e => { if (e.key === "Escape") { toggleDrawer(false); $("lb").classList.remove("open"); } });

$("nav").addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { toggleDrawer(false); goTo(go.dataset.go); return; }
  const b = e.target.closest("[data-view]"); if (!b) return;
  toggleDrawer(false);
  if (b.dataset.view === "all") { view = "all"; kindFilter = "all"; selDay = null; showPast = false; render(); goTo("content"); }
  else openCourse(b.dataset.view);
});

$("kindFilters").addEventListener("click", e => {
  const b = e.target.closest("[data-kind]"); if (!b) return;
  kindFilter = b.dataset.kind; render();
});

$("sched").addEventListener("click", e => {
  const sd = e.target.closest("[data-sd]");
  if (sd) { schedDay = +sd.dataset.sd; renderSchedule(); return; }
  const l = e.target.closest("[data-lesson]");
  if (l && COURSES.includes(l.dataset.lesson)) openCourse(l.dataset.lesson);
});

$("prev").onclick = () => { vm--; if (vm < 0) { vm = 11; vy--; } renderCal(); };
$("next").onclick = () => { vm++; if (vm > 11) { vm = 0; vy++; } renderCal(); };
$("calGrid").addEventListener("click", e => {
  const b = e.target.closest("[data-day]"); if (!b) return;
  selDay = selDay === b.dataset.day ? null : b.dataset.day;
  render();
  if (selDay) goTo("list");
});

$("list").addEventListener("click", e => {
  if (e.target.closest("#clr")) { selDay = null; render(); return; }
  if (e.target.closest("#pt")) { showPast = !showPast; render(); return; }
  const c = e.target.closest("[data-done]");
  if (c) {
    const id = c.dataset.done;
    done.has(id) ? done.delete(id) : done.add(id);
    try { localStorage.setItem("done", JSON.stringify([...done])); } catch {}
    render(); return;
  }
  const o = e.target.closest("[data-open]");
  if (o) {
    if (o.dataset.type === "pdf") window.open(o.dataset.open, "_blank", "noopener");
    else { $("lb").querySelector("img").src = o.dataset.open; $("lb").classList.add("open"); }
  }
});
$("lb").onclick = () => $("lb").classList.remove("open");

render(); renderSchedule(); renderRoutine(); renderKarne(); renderPool();
setInterval(renderRoutine, 60000);
</script>
